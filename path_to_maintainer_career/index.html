<!DOCTYPE html>
<html>
  <head>
    <title>The Path To Maintainer</title>
    <meta charset="utf-8">
    <style>

      @import url('https://fonts.googleapis.com/css?family=Inconsolata');

      body {
        font-family: 'Inconsolata'; 
        color: snow;
        background: black;
      }

      a, a:visited {
        color: #0000FF;
        text-decoration: none; }

      /* these get shuffled by css, so the background has to be opaque
         or they will all show through each other */

      .remark-slides-area, .remark-slide-content {
        background: #1a1a18;
      }

      /* force the border to be invisible since the monitor is the frame */
      .remark-slide-scaler {
        box-shadow: none;
      }

      h1, h2, h3 {
        font-family: 'Inconsolata';
        font-weight: bold;
        font-size: '200%';
      }

      p {
        font-size: 140%;
      }

      small {
          font-size: 50%;
      }

    /* Ensure certain elements are never larger than the slide itself */
      img, video, iframe {
            max-width: 100%;
            max-height: 100%;
      }

    /* yellow-on-black terminal code  */
      pre, code {
            padding: 5px;
            overflow: auto;
            max-height: 900px;
            width: 125%;
            word-wrap: normal;
            background: black;
            color: yellow;
      }

      .remark-code, .remark-inline-code { font-family: 'Ubuntu Mono'; }

      /* Hide remark's built-in timer in all forms */
      .remark-timer,
      .remark-presenter-timer,
      .remark-toolbar-timer,
      [class*="timer"]:not(#pacing-timer) {
        display: none !important;
      }

      /* Show pacing timer only in presenter mode */
      #pacing-timer {
        display: none;
      }
      .remark-presenter-mode #pacing-timer {
        display: block !important;
      }

    </style>
  </head>
  <body>
    <div id="pacing-timer" style="position:fixed;top:10px;right:10px;font-size:18px;color:#ffffff;font-family:Inconsolata,monospace;z-index:9999;background:rgba(0,0,0,0.7);padding:6px 14px;border-radius:4px;"></div>
    <script src="js/remark-latest.min.js">
    </script>
    <script>
      var slideshow = remark.create({
            sourceUrl: 'slides.md'
      });

      // Pacing timer — 45 minutes total (keynote)
      var TOTAL_SECONDS = 45 * 60;
      var startTime = null;
      var timerInterval = null;
      var initialSlide = slideshow.getCurrentSlideIndex();
      var started = false;

      function pad(n) { return n < 10 ? '0' + n : n; }

      function formatTime(seconds) {
        var m = Math.floor(seconds / 60);
        var s = seconds % 60;
        return pad(m) + ':' + pad(s);
      }

      function updateTimer() {
        if (!startTime) return;
        var elapsed = Math.floor((Date.now() - startTime) / 1000);
        var remaining = Math.max(0, TOTAL_SECONDS - elapsed);
        var totalSlides = slideshow.getSlideCount();
        var currentSlide = slideshow.getCurrentSlideIndex() + 1;
        var slidesLeft = totalSlides - currentSlide;
        var secsPerSlide = slidesLeft > 0 ? Math.floor(remaining / slidesLeft) : 0;

        var timerEl = document.getElementById('pacing-timer');
        if (timerEl) {
          timerEl.innerHTML =
            '⏱ Elapsed: ' + formatTime(elapsed) +
            ' | Remaining: ' + formatTime(remaining) +
            ' | ~' + formatTime(secsPerSlide) + '/slide (' + slidesLeft + ' left)';
          timerEl.style.color = remaining < 300 ? '#ff4444' : '#ffffff';
        }
      }

      slideshow.on('afterShowSlide', function(slide) {
        if (!started && slideshow.getCurrentSlideIndex() !== initialSlide) {
          started = true;
          startTime = Date.now();
          timerInterval = setInterval(updateTimer, 1000);
        }
        if (startTime) updateTimer();
      });

    </script>
  </body>
</html>
